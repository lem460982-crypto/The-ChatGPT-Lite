<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>ChatGPT Lite</title>

<style>
body{
    font-family: Helvetica, Arial;
    margin:10px;
    background:#f2f2f2;
}
textarea{
    width:100%;
    height:120px;
    font-size:16px;
}
button{
    width:100%;
    height:40px;
    font-size:18px;
}
#out{
    margin-top:10px;
    background:white;
    padding:10px;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<h2>ChatGPT Lite</h2>

<input id="key" type="password" placeholder="API Key" style="width:100%;height:35px">

<br><br>

<textarea id="msg" placeholder="Nhập câu hỏi..."></textarea>

<br><br>

<button onclick="ask()">Gửi</button>

<div id="out"></div>

<script>

function ask(){

var key=document.getElementById("key").value;
var msg=document.getElementById("msg").value;

document.getElementById("out").innerHTML="Đang trả lời...";

fetch("https://api.openai.com/v1/responses",{

method:"POST",

headers:{
"Authorization":"Bearer "+key,
"Content-Type":"application/json"
},

body:JSON.stringify({

model:"gpt-5",
input:msg

})

})

.then(r=>r.json())

.then(function(d){

try{

document.getElementById("out").innerHTML=
d.output[0].content[0].text;

}catch(e){

document.getElementById("out").innerHTML=
JSON.stringify(d,null,2);

}

});

}

</script>

</body>
</html>
